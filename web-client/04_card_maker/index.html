<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <div class="left-part">
            <h2>Конструктор визиток</h2>

            <div>
                <label>Наименование организации</label>
                <input placeholder="ООО 'Ориентир'" id="org">
            </div>

            <div class="field-row">
                <div class="field-main">
                    <label>Фамилия, имя, отчество</label>
                    <input placeholder="Иванов Иван Иванович" id="fio">
                </div>
                <div class="field-controls">
                    <div class="btn-group align-group" data-target="fio">
                        <button class="ctrl-btn" data-value="left">Л</button>
                        <button class="ctrl-btn active" data-value="center">Ц</button>
                        <button class="ctrl-btn" data-value="right">П</button>
                    </div>
                    <div class="btn-group size-group" data-target="fio">
                        <button class="ctrl-btn" data-value="24">24px</button>
                        <button class="ctrl-btn active" data-value="26">26px</button>
                        <button class="ctrl-btn" data-value="28">28px</button>
                    </div>
                </div>
            </div>
    
            <div class="field-row">
                <div class="field-main">
                    <label>Должность</label>
                    <input placeholder="" id="position">
                </div>
                <div class="field-controls">
                    <div class="btn-group align-group" data-target="position">
                        <button class="ctrl-btn" data-value="left">Л</button>
                        <button class="ctrl-btn active" data-value="center">Ц</button>
                        <button class="ctrl-btn" data-value="right">П</button>
                    </div>
                    <div class="btn-group size-group" data-target="position">
                        <button class="ctrl-btn" data-value="14">14px</button>
                        <button class="ctrl-btn active" data-value="16">16px</button>
                        <button class="ctrl-btn" data-value="18">18px</button>
                    </div>
                </div>
            </div>
    
            <div>
                <label>Телефон</label>
                <input placeholder="" id="phone">
            </div>
            
            <div>
                <label>Email</label>
                <input placeholder="" id="email">
            </div>
    
            <div>
                <label>Адрес</label>
                <input placeholder="" id="address">
            </div>
            
            <button id="apply">Применить</button>
        </div>
    
        <div class="preview-part">
            <div class="card">
                <h4 id="card-org">ООО "Ориентир"</h4>
                <h1 id="card-fio">Кротов Антон Дмитриевич</h1>
                <h3 id="card-position">Программист</h3>
                <h5 id="card-phone">Телефон</h5>
                <h5 id="card-email">Email</h5>
                <h5 id="card-address">Адрес</h5>
            </div>
        </div>
        
    </div>

    <script src="script.js"></script>
</body>
</html>
